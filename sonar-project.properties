# SonarQube / SonarScanner configuration for the Temperature Converter project.
# The server is expected to run locally at http://localhost:9000.
# The analysis token is read from the SONAR_TOKEN environment variable and is
# intentionally not stored in this file.

sonar.projectKey=otp1-temperature-converter
sonar.projectName=Temperature_Converter
sonar.projectVersion=1.0-SNAPSHOT
sonar.host.url=http://localhost:9000

sonar.sourceEncoding=UTF-8
sonar.sources=src/main/java
sonar.tests=src/test/java

sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# JaCoCo XML report produced by `mvn verify`.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# JavaFX entry points and the controller are excluded from unit-test coverage
# in the JaCoCo configuration as well, because they need a running JavaFX
# toolkit. Keeping the two configurations aligned lets SonarQube evaluate the
# same testable core code that JaCoCo measures.
sonar.coverage.exclusions=\
  src/main/java/TempConverterApp.java,\
  src/main/java/Launcher.java,\
  src/main/java/TempConverterController.java

sonar.exclusions=target/**,data/**,.scannerwork/**
