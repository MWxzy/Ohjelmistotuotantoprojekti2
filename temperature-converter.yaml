apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-converter
  labels:
    app: temperature-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperature-converter
  template:
    metadata:
      labels:
        app: temperature-converter
    spec:
      containers:
        - name: temperature-converter
          image: junkkari/temperature-converter-gui:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DISPLAY
              value: "host.docker.internal:0.0"
            - name: JAVA_TOOL_OPTIONS
              value: "-Dfile.encoding=UTF-8 -Dprism.order=sw"
            - name: LANG
              value: "C.UTF-8"
            - name: LC_ALL
              value: "C.UTF-8"
